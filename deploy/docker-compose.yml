# sentinel with a scraper and a dashboard in front of it.
# from the repo root:  docker compose -f deploy/docker-compose.yml up --build

services:
  sentinel:
    build:
      context: ..
    # crash mode on purpose, so the counters actually move and the dashboard
    # has something to draw
    command: ["--restart", "--metrics-port", "9101", "/usr/local/bin/worker", "crash"]
    ports:
      - "9101:9101"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - sentinel
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
