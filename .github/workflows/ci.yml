name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compile
        run: cmake --build build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-dir
          path: build/
          retention-days: 1

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-dir
          path: build/

      # artifacts do not preserve file modes, so the binaries come back
      # without the executable bit and ctest cannot run them
      - name: Restore executable bits
        run: chmod +x build/sentinel build/worker

      - name: Run ctest
        run: ctest --test-dir build --output-on-failure

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the test scripts
        run: shellcheck tests/*.shgit checkout main

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t sentinel:ci .

      - name: Sentinel is pid 1 inside the container
        run: docker run --rm sentinel:ci /bin/cat /proc/1/comm | grep -qx sentinel

      - name: Container stops promptly instead of waiting out the timeout
        run: |
          docker run -d --name probe sentinel:ci /usr/local/bin/worker sleep
          sleep 1
          start=$(date +%s)
          docker stop probe > /dev/null
          elapsed=$(( $(date +%s) - start ))
          docker rm probe > /dev/null
          echo "docker stop took ${elapsed}s"
          if [ "$elapsed" -ge 5 ]; then
            echo "the container ignored SIGTERM and had to be killed"
            exit 1
          fi
