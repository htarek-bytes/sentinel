name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compile
        run: cmake --build build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-dir
          path: build/
          retention-days: 1

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-dir
          path: build/

      # artifacts do not preserve file modes, so the binaries come back
      # without the executable bit and ctest cannot run them
      - name: Restore executable bits
        run: chmod +x build/sentinel build/worker

      - name: Run ctest
        run: ctest --test-dir build --output-on-failure

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the test scripts
        run: shellcheck tests/*.sh

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t sentinel:ci .

      - name: Sentinel is pid 1 inside the container
        run: docker run --rm sentinel:ci /bin/cat /proc/1/comm | grep -qx sentinel

      - name: Container stops promptly instead of waiting out the timeout
        run: |
          docker run -d --name probe sentinel:ci /usr/local/bin/worker sleep
          sleep 1
          start=$(date +%s)
          docker stop probe > /dev/null
          elapsed=$(( $(date +%s) - start ))
          docker rm probe > /dev/null
          echo "docker stop took ${elapsed}s"
          if [ "$elapsed" -ge 5 ]; then
            echo "the container ignored SIGTERM and had to be killed"
            exit 1
          fi

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose -f deploy/docker-compose.yml config > /dev/null

      - name: Bring the stack up
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - name: Prometheus is scraping sentinel
        run: |
          up=""
          for _ in $(seq 1 40); do
            up=$(curl -sf --get http://localhost:9090/api/v1/query \
                 --data-urlencode 'query=up{job="sentinel"}' \
                 | jq -r '.data.result[0].value[1] // empty') || true
            [ "$up" = "1" ] && break
            sleep 3
          done
          if [ "$up" != "1" ]; then
            echo "prometheus never reported the sentinel target as up"
            docker compose -f deploy/docker-compose.yml ps
            docker compose -f deploy/docker-compose.yml logs --tail=60
            exit 1
          fi
          echo "sentinel target is up"

      - name: The restart counter climbs through Prometheus
        run: |
          sleep 25
          v=$(curl -sf --get http://localhost:9090/api/v1/query \
               --data-urlencode 'query=sentinel_restarts_total' \
               | jq -r '.data.result[0].value[1] // empty')
          echo "sentinel_restarts_total = ${v:-none}"
          if [ -z "$v" ] || [ "${v%%.*}" -lt 1 ]; then
            echo "the counter never moved, so nothing is really being scraped"
            docker compose -f deploy/docker-compose.yml logs --tail=60
            exit 1
          fi

      - name: Alert rules are loaded
        run: |
          n=$(curl -sf http://localhost:9090/api/v1/rules | jq '[.data.groups[].rules[]] | length')
          echo "prometheus loaded $n alert rule(s)"
          [ "$n" -ge 2 ]

      - name: Grafana serves the provisioned dashboard
        run: |
          code=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health) || true
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { echo "grafana never became healthy"; exit 1; }
          curl -sf 'http://localhost:3000/api/search?query=sentinel' | jq -e 'length > 0' > /dev/null
          echo "dashboard is provisioned"

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
